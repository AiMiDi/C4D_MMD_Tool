# Tag release: verified existing Build (or a fresh matrix) → Inno → ZIP → Release.
# Local packaging: cmake --preset package-windows && cmake --build --preset inno-installer (see DEVELOPMENT.md, CMakeUserPresets.json).

name: Package

on:
  workflow_dispatch:
    inputs:
      windows_only:
        description: 'Only repackage the Windows installer'
        type: boolean
        default: false
      version:
        description: Numeric installer version for CI artifacts (does not publish a release)
        type: string
        required: true
        default: '0.0.0'
      build_run_id:
        description: Optional Build or Package run with a successful full build matrix; empty selects automatically
        type: string
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-source:
    name: Resolve verified build artifacts
    runs-on: ubuntu-latest
    outputs:
      reused: ${{ steps.resolve.outputs.reused }}
      artifact_run_id: ${{ steps.resolve.outputs.artifact_run_id }}
      artifact_source_commit: ${{ steps.resolve.outputs.artifact_source_commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false
      - name: Select source-compatible successful build matrix
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_BUILD_RUN: ${{ inputs.build_run_id }}
        run: |
          python scripts/resolve_package_build.py \
            --repository "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --current-run "$GITHUB_RUN_ID" --build-run-id "$REQUESTED_BUILD_RUN" \
            --output package-build-provenance.json
      - name: Save source and artifact provenance
        uses: actions/upload-artifact@v7
        with:
          name: package-build-provenance
          path: package-build-provenance.json
          if-no-files-found: error

  build:
    name: Build (reusable)
    needs: build-source
    if: needs.build-source.outputs.reused != 'true'
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      ref: ${{ github.sha }}

  package-windows:
    needs: [build-source, build]
    if: ${{ !cancelled() && needs.build-source.result == 'success' && (needs.build-source.outputs.reused == 'true' || needs.build.result == 'success') }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout (resources for installer)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          submodules: false

      - name: Checkout installer setup submodule
        run: |
          git submodule sync -- setup
          git submodule update --init --force setup

      - name: Download Windows build artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: build-Windows-x64-*
          path: ${{ github.workspace }}/_dl
          merge-multiple: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.build-source.outputs.artifact_run_id }}

      - name: Layout _build_msvc for installer_script.iss
        run: |
          set -euo pipefail
          for sdk in sdk_r20 sdk_r21 sdk_r23 sdk_r25 sdk_2023 sdk_2024 sdk_2025 sdk_2026 sdk_2027; do
            mkdir -p "_build_msvc/${sdk}/bin/Release/plugins/mmdtool"
            src="_dl/build-Windows-x64-${sdk}"
            if [ -d "$src" ]; then
              cp -R "$src"/* "_build_msvc/${sdk}/bin/Release/plugins/mmdtool/"
            else
              echo "Missing artifact: $src" >&2
              exit 1
            fi
          done

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compute package version
        id: ver
        shell: bash
        env:
          CI_PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          V="${CI_PACKAGE_VERSION:-${GITHUB_REF_NAME#v}}"
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Expected a numeric package version" >&2
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Run ISCC
        shell: pwsh
        run: |
          foreach ($sdk in @('sdk_r20','sdk_r21','sdk_r23','sdk_r25','sdk_2023','sdk_2024','sdk_2025','sdk_2026','sdk_2027')) {
            cmake "-DPLUGIN_DIR=$env:GITHUB_WORKSPACE/_build_msvc/$sdk/bin/Release/plugins/mmdtool" -P cmake/check_profiling_disabled.cmake
            if ($LASTEXITCODE -ne 0) { throw "Instrumented or missing package module: $sdk" }
            cmake "-DRESOURCE_DIR=$env:GITHUB_WORKSPACE/_build_msvc/$sdk/bin/Release/plugins/mmdtool/res" "-DVERSION=${{ steps.ver.outputs.version }}" -P cmake/stamp_package_version.cmake
            if ($LASTEXITCODE -ne 0) { throw "Version stamping failed for $sdk" }
          }
          ./cmake/prepare_installer_resources.ps1 -ProjectRoot $env:GITHUB_WORKSPACE
          $isccCandidates = @()
          $isccCommand = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($isccCommand) {
            $isccCandidates += $isccCommand.Source
          }
          if ($env:ProgramFiles) {
            $isccCandidates += (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
          }
          if (${env:ProgramFiles(x86)}) {
            $isccCandidates += (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe')
          }
          $isccCandidates = $isccCandidates | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -Unique
          if (-not $isccCandidates) {
            throw "ISCC.exe not found"
          }

          $iscc = $isccCandidates[0]
          $arguments = @(
            "/DPluginVersion=${{ steps.ver.outputs.version }}",
            "/FMMD-Tool-v${{ steps.ver.outputs.version }}-Windows-x64-Setup",
            "/DSdkBuildDir=_build_msvc",
            "/DSdkBinConfig=Release",
            "$env:GITHUB_WORKSPACE\setup\Common\installer_script.iss"
          )
          Write-Host "Using ISCC: $iscc"
          $process = Start-Process -FilePath $iscc -ArgumentList $arguments -Wait -NoNewWindow -PassThru
          if ($process.ExitCode -ne 0) {
            throw "ISCC failed with exit code $($process.ExitCode)"
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: setup/Common/Output/*.exe
          if-no-files-found: error

  package-macos:
    needs: [build-source, build]
    if: ${{ !cancelled() && !inputs.windows_only && needs.build-source.result == 'success' && (needs.build-source.outputs.reused == 'true' || needs.build.result == 'success') }}
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      # 需要仓库里的 cmake/check_profiling_disabled.cmake 做插桩标记门禁，
      # 否则 cmake -P 会因工作区没有仓库而报 "Not a file"。
      - uses: actions/checkout@v6
      - name: Download macOS build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: build-macOS-x86_64-*
          path: ${{ github.workspace }}/_dl
          merge-multiple: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.build-source.outputs.artifact_run_id }}

      - name: Zip complete per-SDK plugin artifacts
        env:
          CI_PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${CI_PACKAGE_VERSION:-${GITHUB_REF_NAME#v}}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Expected a numeric package version" >&2
            exit 1
          fi
          mkdir -p dist
          for sdk in sdk_r20 sdk_r21 sdk_r23 sdk_r25 sdk_2023 sdk_2024 sdk_2025 sdk_2026 sdk_2027; do
            # Show Cinema 4D compatibility instead of internal SDK directory names.
            case "$sdk" in
              sdk_r20) c4d="R20" ;;
              sdk_r21) c4d="R21-S22" ;;
              sdk_r23) c4d="R23-S24" ;;
              sdk_r25) c4d="R25-S26" ;;
              sdk_2023|sdk_2024|sdk_2025|sdk_2026|sdk_2027) c4d="${sdk#sdk_}" ;;
              *) echo "Unknown SDK: $sdk" >&2; exit 1 ;;
            esac
            src="_dl/build-macOS-x86_64-${sdk}"
            if [ ! -d "$src" ]; then echo "Missing $src" >&2; exit 1; fi
            mkdir -p "pkg/${sdk}/mmdtool"
            cp -R "$src"/. "pkg/${sdk}/mmdtool/"
            cmake "-DPLUGIN_DIR=pkg/${sdk}/mmdtool" -P cmake/check_profiling_disabled.cmake
            test -f "pkg/${sdk}/mmdtool/res/cmt_config.json"
            printf '%s\n' "$version" > "pkg/${sdk}/mmdtool/res/cmt_version.txt"
            test -f "pkg/${sdk}/mmdtool/res/c4d_symbols.h"
            test -d "pkg/${sdk}/mmdtool/res/description"
            if find "pkg/${sdk}/mmdtool" -type l | grep -q .; then
              echo "Linked files in plugin artifact: $sdk" >&2
              exit 1
            fi
            (cd "pkg/${sdk}" && zip -r "${{ github.workspace }}/dist/MMD-Tool-v${version}-Cinema4D-${c4d}-macOS-x86_64.zip" mmdtool)
          done

      - name: Upload macOS zip artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-zips
          path: dist/*.zip
          if-no-files-found: error

  release:
    # Reusing artifacts skips the transitive build dependency. Override the
    # implicit success() check while still requiring both packaging jobs.
    if: ${{ !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.build-source.result == 'success' && needs.package-windows.result == 'success' && needs.package-macos.result == 'success' }}
    needs: [build-source, package-windows, package-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download installer
        uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: ${{ github.workspace }}/assets

      - name: Download macOS zips
        uses: actions/download-artifact@v8
        with:
          name: macos-zips
          path: ${{ github.workspace }}/assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MMD Tool for Cinema 4D ${{ github.ref_name }}
          body: |
            ## Downloads / 下载

            - **Windows x64**: download `MMD-Tool-*-Windows-x64-Setup.exe`. The installer lets you select Cinema 4D R20 through 2027.
            - **macOS Intel (x86_64)**: download the ZIP matching your Cinema 4D version, then place its `mmdtool` folder in your Cinema 4D plugins directory. `R21-S22`, `R23-S24`, and `R25-S26` each cover the paired releases.
            - **Windows**：下载 `Windows-x64-Setup.exe` 安装包，在安装向导中选择 Cinema 4D 版本。
            - **macOS Intel**：按 Cinema 4D 版本选择 `macOS-x86_64.zip`，解压后将 `mmdtool` 文件夹放入 Cinema 4D 插件目录。当前发布资产仅提供 Intel 构建，Apple Silicon 构建仍作为 CI 验证。

            ## Changelog

            _Add release notes here._

            Built from commit `${{ github.sha }}`.
            SDK artifacts from verified Build run `${{ needs.build-source.outputs.artifact_run_id }}`, source `${{ needs.build-source.outputs.artifact_source_commit }}`.
          files: |
            assets/*.exe
            assets/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
