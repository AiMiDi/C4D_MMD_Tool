# Root CMake workflow: same presets as locally (CMakePresets.json), override CMT_SDK_DIR per matrix cell.
# PR/main: functional tests + latest SDK. Release/dispatch: full 21-job matrix.

name: Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_benchmarks:
        description: Run the separate libMMD benchmark job
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: Git ref to checkout (e.g. tag ref for releases)
        type: string
        required: false
        default: ""

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  checks:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          submodules: false

      - name: Checkout build submodules
        shell: bash
        run: |
          git submodule sync -- dependency/bullet3 dependency/libMMD
          git submodule update --init --recursive dependency/bullet3 dependency/libMMD

      - name: Verify runtime resource copying
        shell: pwsh
        run: ./scripts/check_runtime_resources.ps1 -FixtureRoot "$env:RUNNER_TEMP/cmt-resources"

      - name: Verify pinned installer resource adaptation
        shell: pwsh
        run: ./scripts/check_installer_resources.ps1 -FixtureRoot "$env:RUNNER_TEMP/cmt-installer-resources"

      - name: Select Python for production MCP checks
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verify typed MCP transport and operation handling
        run: python -m unittest discover -s mcp/tests -v

      - name: Configure functional tests
        run: cmake --preset dev-windows-deps-test

      - name: Run functional libMMD CTest
        run: cmake --build --preset cmt-deps-test

      - name: Run plugin algorithm CTest
        run: cmake --build --preset cmt-plugin-tests

      - name: Configure latest SDK Release
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: cmake --preset release-windows -D CMT_DEPS_ENABLE_LIBMMD_TESTS=OFF -D CMT_ENABLE_PLUGIN_TESTS=OFF -D CMT_ENABLE_RUNTIME_REGRESSION=OFF

      - name: Compile latest SDK Release
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: cmake --build --preset workflow-release

      - name: Upload functional test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: functional-test-logs
          path: |
            _build_msvc/cmt_deps/libMMD/Testing/Temporary/
            _build_msvc/tests/Testing/Temporary/
          if-no-files-found: ignore

  benchmarks:
    if: github.event_name == 'workflow_dispatch' && inputs.run_benchmarks
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false
      - shell: bash
        run: git submodule update --init --recursive dependency/bullet3 dependency/libMMD
      - run: cmake --preset dev-windows-deps-test
      - run: cmake --build --preset cmt-deps-benchmark
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-logs
          path: _build_msvc/cmt_deps/libMMD/Testing/Temporary/
          if-no-files-found: ignore

  matrix-build:
    if: github.event_name != 'pull_request' && !(github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: checks
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        # Base matrix: build every supported SDK on these release platforms.
        # ARM64 macOS validation is added separately below because R20-R23 SDKs
        # do not support ARM.
        os:
          # x64 Windows with Visual Studio 2022 and the v143 toolset.
          - windows-2022
          # x86_64 Intel macOS 26; its output is packaged for releases.
          - macos-26-intel
        sdk:
          - sdk_r20
          - sdk_r21
          - sdk_r23
          - sdk_r25
          - sdk_2023
          - sdk_2024
          - sdk_2025
          - sdk_2026
        include:
          - os: windows-2022
            configure_preset: release-windows
            build_preset: workflow-release
            deps_generator: "Visual Studio 17 2022"
            upload_artifact: true
          # Intel output is packaged for the current release workflow.
          - os: macos-26-intel
            configure_preset: release-macos
            build_preset: workflow-release-macos
            deps_generator: Xcode
            macos_arch: x86_64
            upload_artifact: true
          # Validate native Apple Silicon against the latest supported macOS
          # toolchain without colliding with the packaged Intel artifacts.
          # R20-R23 do not have ARM-capable SDKs, so only add S24/R25 and newer.
          - os: macos-26
            sdk: sdk_r25
            configure_preset: release-macos
            build_preset: workflow-release-macos
            deps_generator: Xcode
            macos_arch: arm64
            upload_artifact: false
          - os: macos-26
            sdk: sdk_2023
            configure_preset: release-macos
            build_preset: workflow-release-macos
            deps_generator: Xcode
            macos_arch: arm64
            upload_artifact: false
          - os: macos-26
            sdk: sdk_2024
            configure_preset: release-macos
            build_preset: workflow-release-macos
            deps_generator: Xcode
            macos_arch: arm64
            upload_artifact: false
          - os: macos-26
            sdk: sdk_2025
            configure_preset: release-macos
            build_preset: workflow-release-macos
            deps_generator: Xcode
            macos_arch: arm64
            upload_artifact: false
          - os: macos-26
            sdk: sdk_2026
            configure_preset: release-macos
            build_preset: workflow-release-macos
            deps_generator: Xcode
            macos_arch: arm64
            upload_artifact: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Reusable workflows inherit the caller event; use the requested ref directly.
          ref: ${{ inputs.ref || github.ref }}
          # Nested dependency tags/commits are not always reachable from a depth=1
          # submodule clone, which forces fragile direct SHA fetches.
          fetch-depth: 0
          submodules: false

      - name: Checkout build submodules
        run: |
          git submodule sync -- dependency/bullet3 dependency/libMMD
          git submodule update --init --force --recursive dependency/bullet3 dependency/libMMD

      - name: Identify dependency toolchain and revisions
        id: deps-identity
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            vswhere="C:/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
            toolchain=$("$vswhere" -latest -property installationVersion)
            install=$("$vswhere" -latest -property installationPath | tr -d '\r')
            toolchain+=$(ls "$install/VC/Tools/MSVC")
          else
            toolchain=$(xcodebuild -version; clang --version)
          fi
          toolchain+=$(cmake --version)
          echo "toolchain=$(printf '%s' "$toolchain" | python -c 'import hashlib,sys; print(hashlib.sha256(sys.stdin.buffer.read()).hexdigest())')" >> "$GITHUB_OUTPUT"
          echo "revisions=$(git submodule status --recursive dependency/bullet3 dependency/libMMD | python -c 'import hashlib,sys; print(hashlib.sha256(sys.stdin.buffer.read()).hexdigest())')" >> "$GITHUB_OUTPUT"

      - name: Cache prebuilt dependencies
        id: deps-cache
        uses: actions/cache@v5
        with:
          path: _build_msvc/cmt_deps_prebuilt
          key: deps-v2-${{ matrix.os }}-${{ matrix.macos_arch || 'x64' }}-Release-${{ steps.deps-identity.outputs.toolchain }}-${{ steps.deps-identity.outputs.revisions }}-${{ hashFiles('dependency/CMakeLists.txt', 'cmake/mmdtool_plugin_dependencies.cmake', 'CMakePresets.json', '.github/workflows/build.yml') }}

      - name: Build dependencies (on cache miss)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          deps_extra=()
          deps_build_extra=()
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            deps_extra=(-A x64 -T v143)
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            deps_extra=("-DCMAKE_OSX_ARCHITECTURES=${{ matrix.macos_arch }}")
            deps_build_extra=(-- ARCHS=${{ matrix.macos_arch }} ONLY_ACTIVE_ARCH=NO)
          fi
          cmake -S dependency -B _build_msvc/cmt_deps \
            -G "${{ matrix.deps_generator }}" \
            "${deps_extra[@]}" \
            "-DCMAKE_ARCHIVE_OUTPUT_DIRECTORY_RELEASE=${{ github.workspace }}/_build_msvc/cmt_deps_prebuilt/lib" \
            "-DCMAKE_ARCHIVE_OUTPUT_DIRECTORY_DEBUG=${{ github.workspace }}/_build_msvc/cmt_deps_prebuilt/lib"
          cmake --build _build_msvc/cmt_deps --config Release "${deps_build_extra[@]}"

      - name: Configure root (preset + prebuilt deps)
        run: |
          extra_args=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            # Compile each macOS runner's native plugin architecture.
            extra_args+=("-DCMT_SDK_OSX_ARCHITECTURES=${{ matrix.macos_arch }}")
          fi
          cmake --preset "${{ matrix.configure_preset }}" \
            -D "CMT_SDK_DIR=${{ github.workspace }}/${{ matrix.sdk }}" \
            -D CMT_SDK_BUILD_CONFIG=Release \
            -D CMT_WITH_DEPENDENCY_SUBDIR=OFF \
            -D CMT_ENABLE_RUNTIME_REGRESSION=OFF \
            -D CMT_RUNTIME_RESOURCE_CONFIG_POLICY=reset \
            -D "CMT_DEPS_PREBUILT_DIR=${{ github.workspace }}/_build_msvc/cmt_deps_prebuilt" \
            "${extra_args[@]}"

      - name: Build cmt-workflow (Release)
        run: cmake --build --preset "${{ matrix.build_preset }}"

      - name: Upload plugin output
        if: ${{ matrix.upload_artifact }}
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ runner.os }}-${{ matrix.macos_arch || 'x64' }}-${{ matrix.sdk }}
          path: _build_msvc/${{ matrix.sdk }}/bin/Release/plugins/mmdtool/
          retention-days: 7
          if-no-files-found: error
