[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmdtool-mcp"
version = "1.0.0"
description = "Typed stdio MCP adapter for the Cinema 4D MMD Tool production API"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mmdtool-mcp = "mmdtool_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mmdtool_mcp*"]
